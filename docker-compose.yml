services:
  transitwalter:
    build: .
    container_name: transitwalter
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - transitwalter-data:/data
    # kein Port: erreichbar nur über den Reverse Proxy im Netz „walter“, der X-Walter-User setzt (Walterpass)
    networks: [walter]

volumes:
  transitwalter-data:

networks:
  walter:
    external: true
